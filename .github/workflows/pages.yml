name: Publish Spotter to GitHub Pages

# Pages for this repo currently publishes straight from the main branch, so Spotter lives at
# https://mahannoorii.github.io/Calorie-Counting-App/spotter/ with no workflow needed. Run this
# by hand only after switching Settings → Pages → Source to "GitHub Actions"; Spotter then
# moves to the site's root. (Same origin either way, so saved data isn't affected.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spotter
      - id: deployment
        uses: actions/deploy-pages@v4
